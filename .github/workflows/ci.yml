name: XZeroy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Upload compiled XZeroy
        uses: actions/upload-artifact@v4
        with:
          name: XZeroy
          path: dist/XZeroy.js
          if-no-files-found: error
          retention-days: 30
