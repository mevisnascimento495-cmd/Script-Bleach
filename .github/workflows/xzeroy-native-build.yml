name: XZeroy Native Android Build

on:
  push:
    branches:
      - xzeroy-native-app-bridge
    paths:
      - "xzeroy-native/**"
      - ".github/workflows/xzeroy-native-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "xzeroy-native/**"
      - ".github/workflows/xzeroy-native-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Check bridge JavaScript
        run: npm --prefix xzeroy-native/server-bridge run check

      - name: Build debug APK
        run: gradle -p xzeroy-native/android assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: XZeroy-debug-apk
          path: xzeroy-native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
